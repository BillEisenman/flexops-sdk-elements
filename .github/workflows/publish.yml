name: Publish to npm

# Publishes @flexops/elements to registry.npmjs.org via npm trusted publishing
# (OIDC) — no stored token, no MFA prompt. Triggered on vX.Y.Z tag push or
# manual workflow_dispatch.
#
# One-time setup on npmjs.com (required before the first run):
#   1. Log in to npmjs.com → package @flexops/elements → Settings →
#      Trusted Publishers
#   2. Add a GitHub Actions trusted publisher with:
#        Organization or user: BillEisenman
#        Repository:           flexops-sdk-elements
#        Workflow filename:    publish.yml
#        Environment:          (leave blank)
#
# Docs: https://docs.npmjs.com/trusted-publishers

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Ensure npm supports OIDC publishing
        run: npm install -g npm@latest

      # Same script CI runs on every PR (scripts/check-exports.mjs), kept here as
      # the last gate before publish. It used to be inlined only in this job, so
      # a broken export shape was first discovered during a release.
      - name: Smoke-check package exports resolve
        run: node scripts/check-exports.mjs

      - name: Publish (OIDC trusted publisher)
        run: npm publish --access public --provenance
