name: CI

# Builds, tests and lints on every push and pull request.
#
# Until this existed the only workflow here was publish.yml, which runs on tag
# push — so the first thing to exercise a change was a release. That is the
# worst moment to discover a break, and it happened: the vite 6 -> 8 bump in #3
# left the package unable to build, while its 98 tests passed. Vitest never
# touches the bundler, so `npm run build` is the step that catches bundler and
# dependency breaks. It runs before the tests deliberately.
#
# Node 20 matches publish.yml, so CI exercises what actually publishes.

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build, test, lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # The same check publish.yml runs immediately before `npm publish`. Running
      # it here too means a broken export shape fails a PR rather than a release.
      - name: Check package exports resolve
        run: node scripts/check-exports.mjs

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint
